package:
  name: libtiff
  version: 4.7.2
  tag:
    - library
    - static_library
source:
  # TODO: The root certificate of `download.osgeo.org` has been expired and requires the latest version (2022.6.15) of certifi.
  # url: https://download.osgeo.org/libtiff/tiff-4.4.0.tar.gz
  url: https://download.osgeo.org/libtiff/tiff-4.7.2.tar.gz
  sha256: 672bd7d10aee4606171afb864f3570b83340f6a33e2c186dc0512f7145ffdf6a

build:
  type: static_library
  script: |
    embuilder build libjpeg --pic
    emconfigure ./configure \
        CFLAGS="-fPIC" \
        --disable-shared \
        --disable-dependency-tracking \
        --disable-tools --disable-contrib --disable-tests --disable-docs --disable-cxx \
        --disable-lzma --disable-zstd --disable-jbig \
        --prefix=${WASM_LIBRARY_DIR}
    emmake make -j ${PYODIDE_JOBS:-3}
    emmake make install
